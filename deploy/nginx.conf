# 域名矩阵 —— nginx 站点配置
#
# 用法：
#   cp deploy/nginx.conf /etc/nginx/sites-available/yuming
#   把下面的 530.one 换成你自己的域名，root 换成实际路径
#   ln -s /etc/nginx/sites-available/yuming /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# certbot --nginx 会自动往这个文件里补 443 和证书相关的配置，不用手写。

server {
    listen      80;
    listen      [::]:80;
    server_name 530.one www.530.one;

    root  /var/www/yuming;
    index index.html;

    charset utf-8;

    # 目录访问交给 index.html，比如 /d/vps.bike/ → /d/vps.bike/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # 样式和脚本带内容哈希无关，改完直接重新构建，所以缓存别设太长
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 页面本身不缓存，改完刷新就能看到
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/css text/plain application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/yuming.access.log;
    error_log  /var/log/nginx/yuming.error.log;
}


